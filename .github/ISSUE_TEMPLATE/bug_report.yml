name: 🐛 Bug Report
description: Report an issue, prayer calculation discrepancy, or broken UI
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the form below to help us investigate and resolve it quickly.

  - type: input
    id: city
    attributes:
      label: City or Region
      description: Which city, district, or region is affected? (e.g., Toshkent, Samarkand, Moscow)
      placeholder: e.g. Toshkent
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Logs
      description: Drag and drop screenshots or paste browser console errors here.
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Browser / Device
      description: What device or browser did this happen on?
      options:
        - Chrome / Chromium
        - Safari / iOS Safari
        - Firefox
        - Edge
        - Other mobile browser
    validations:
      required: false
